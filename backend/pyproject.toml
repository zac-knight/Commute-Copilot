[project]
name = "commute-agents"
version = "0.1.0"
description = "Multi-agent commute assistant (transit, weather, calendar) with tracing, evals and an approval gate."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.27",
    "icalendar>=7.3.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "recurring-ical-events>=3.8.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.agents.*"]
strict = true

[tool.ruff.lint.per-file-ignores]
"app/agents/transit/cli.py" = ["E501"]  # long human-readable output lines
"app/agents/transit/tools.py" = ["E501"]  # long tool/field descriptions shown to the model
"app/agents/weather/tools.py" = ["E501"]
"app/agents/calendar/tools.py" = ["E501"]
"app/agents/weather/cli.py" = ["E501"]
"evals/*" = ["E501"]  # report prose and case text are long strings
"app/evaluation/hallucination.py" = ["E501"]
"app/evaluation/summary.py" = ["E501"]
"app/analytics/*.py" = ["E501"]
"app/agents/transit/geo.py" = ["E501"]
"app/orchestrator/router.py" = ["E501"]
"app/orchestrator/engine.py" = ["SIM117"]
"tests/test_eval_suites.py" = ["E501"]
"tests/test_analytics.py" = ["E501"]
"tests/test_trip_stages.py" = ["E501"]
"tests/test_livestream.py" = ["E501"]  # dense case tables

[[tool.mypy.overrides]]
module = ["evals.*", "tests.*"]
ignore_errors = true  # dev-time packages (reached through a lazy import); not part of the typed app
